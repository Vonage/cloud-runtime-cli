---
name: "Install Cloud Runtime CLI"
author: "Cloud Runtime contributors"
description: "Download and Installs Cloud Runtime CLI"
inputs:
  version:
    description: 'Version of Cloud Runtime CLI that should be installed'
    required: false
    default: 'main'
runs:
  using: 'composite'
  steps:
    - name: Download and Install CLI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ $VERSION == *$'\n'* ]]; then
            echo "invalid version" >&2
            exit 1
        fi
        case "$VERSION" in
            ""|main|latest)
                sudo sh "$GITHUB_ACTION_PATH/script/install.sh"
                ;;
            *)
                if ! [[ $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                    echo "invalid version" >&2
                    exit 1
                fi
                VERSION="v${VERSION#v}"
                sudo sh "$GITHUB_ACTION_PATH/script/install.sh" -v "$VERSION"
                ;;
        esac

        # Verify installation
        vcr --version
