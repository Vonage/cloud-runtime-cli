name: CI-Pipeline

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled] # the labels are read by the govulncheck job

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_VERSION: v0.5

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: make lint

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Test # the one command of `make test`; Windows runners may lack make, and the harness compiles to nothing there (unit tests only)
        shell: bash
        run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - id: scan
        # The command of `make vulncheck` (keep the version in step with GOVULNCHECK_VERSION), run directly because make reports every failure as status 2.
        run: |
          # Status 3 means findings. Any other failure is the tool failing, which no label overrides.
          status=0
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
      - name: Fail on findings unless overridden
        if: steps.scan.outputs.status == '3' && !contains(github.event.pull_request.labels.*.name, 'vulncheck-override')
        run: |
          echo "::error::govulncheck found vulnerabilities. Fix them, or add the vulncheck-override label and say why in a comment."
          exit 1

  contract: # ubuntu only: the harness is Unix-only (`//go:build !windows`); macOS is optional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: make contract
      - run: make contract-rich

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Cross compile the five targets
        run: |
          [ -n "$API_VERSION" ] || { echo "API_VERSION is empty"; exit 1; }
          make build-all VERSION="ci-$GITHUB_SHA"
      - name: Check every binary was built from a clean tree with -trimpath
        run: |
          for f in dist/*; do
            go version -m "$f" | grep -q 'vcs.modified=false' || { echo "$f: tree was modified"; exit 1; }
            go version -m "$f" | grep -q -e '-trimpath=true' || { echo "$f: not built with -trimpath"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/, retention-days: 1 }

  smoke:
    name: smoke (${{ matrix.file }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, file: vcr_linux_amd64 }
          - { runner: ubuntu-24.04-arm, file: vcr_linux_arm64 }
          - { runner: macos-latest, file: vcr_darwin_arm64 }
          - { runner: macos-15-intel, file: vcr_darwin_amd64 }
          - { runner: windows-latest, file: vcr_windows_amd64.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - name: vcr --version
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.file }}" || true
          out="$("dist/${{ matrix.file }}" --version)"; echo "$out"
          case "$out" in "vcr-cli version ci-"*) ;; *) echo "unexpected version output"; exit 1 ;; esac

  test-install-using-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install Cloud Runtime CLI
        uses: ./
      - name: Verify installation
        run: vcr --version

  test-install-using-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install Cloud Runtime CLI
        shell: sh
        run: ./script/install.sh
      - name: Verify installation
        run: vcr --version
