# Lefthook configuration for git hooks. Install them once per clone with `make hooks`.
# Docs: https://github.com/evilmartians/lefthook

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  parallel: true
  skip: [merge, rebase]
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files}) || exit 1
        if [ -n "$unformatted" ]; then printf 'gofmt would rewrite:\n%s\n\nrun: make fmt\n' "$unformatted"; exit 1; fi
    lint:
      run: make lint

pre-push:
  commands:
    test:
      run: make test
