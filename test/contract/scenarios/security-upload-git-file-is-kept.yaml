description: "a .git file, as a worktree has, is part of the upload"
group: deploy
args: [deploy]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
  - {path: work/project/.git, content: "gitdir: /elsewhere/.git/worktrees/project\n"}
  - {path: work/project/src/app.js, content: "module.exports = {};\n"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
scrape: [deployed-banner, deployed-instance-id, deployed-service-name, deployed-host-address]
