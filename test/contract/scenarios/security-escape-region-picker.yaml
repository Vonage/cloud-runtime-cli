description: "a region name with terminal control sequences is shown without them in the picker"
group: configure
args: [configure, --graphql-endpoint, "${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql"]
tty: true
requires-hotfix: true
config: none
fixtures:
  regions:
    - {alias: aws.euw1, name: "AWS \x1b]0;pwned\x07\x1b[31mEurope\x1b[0m\x1b[3C(Ireland)", default: true, enabled: true, deploymentApiUrl: "${FAKE}/v1/vcr/euw1/api/deployment", assetsApiUrl: "${FAKE}/v1/vcr/euw1/api/assets", marketplaceApiUrl: "${FAKE}/v1/vcr/euw1/api/marketplace", endpointUrlScheme: http, debuggerUrlScheme: ws, hostTemplate: "http://${OTHER_HOST}"}
    - {alias: aws.use1, name: "AWS - US East (N. Virginia)", enabled: true, deploymentApiUrl: "${FAKE}/v1/vcr/euw1/api/deployment", assetsApiUrl: "${FAKE}/v1/vcr/euw1/api/assets", marketplaceApiUrl: "${FAKE}/v1/vcr/euw1/api/marketplace", endpointUrlScheme: http, debuggerUrlScheme: ws, hostTemplate: "http://${OTHER_HOST}"}
steps:
  - {expect: "Enter your Vonage api key:"}
  - {send: "abc123\r"}
  - {expect: "Enter your Vonage api secret:"}
  - {send: "s3cret-for-tests\r"}
  - {expect: "Select your Vonage region:"}
  - {send: "\r"}
  - {expect: "New configuration file written to"}
expect-reads:
  - "euw1 GET /regions"
