description: "answering n at the confirmation keeps the application and exits 0"
args: [app, remove, 00000000-0000-4000-8000-000000000601]
tty: true
steps:
  - {expect: "Are you sure you want to remove application \"00000000-0000-4000-8000-000000000601\"? [y/n]:"}
  - {send: "n\r"}
  - {expect: "aborted"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
