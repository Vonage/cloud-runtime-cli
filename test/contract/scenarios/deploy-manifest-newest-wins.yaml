description: "when several manifests exist the newest one is used"
args: [deploy]
cwd: work/project
files:
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: older
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
    mtime: "2026-10-10T10:00:00Z"
  - path: work/project/neru.yml
    content: |
      project:
        name: my-project
      instance:
        name: newer
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
    mtime: "2026-10-12T10:00:00Z"
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
scrape: [deployed-banner, deployed-instance-id, deployed-service-name, deployed-host-address]
