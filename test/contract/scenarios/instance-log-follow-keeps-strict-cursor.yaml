description: "following never repeats or recovers a row that shares the newest timestamp"
args: [instance, log, --id, 00000000-0000-4000-8000-000000000501, --follow]
fixtures:
  logs:
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "first", timestamp: "2026-10-14T10:00:01Z"}
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "newest", timestamp: "2026-10-14T10:00:02Z"}
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "same-timestamp", timestamp: "2026-10-14T10:00:02Z", visibleAfterPolls: 1}
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "last", timestamp: "2026-10-14T10:00:03Z", visibleAfterPolls: 2}
steps:
  - {wait-stdout: last}
  - {signal: SIGINT}
expect-reads:
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?after=2026-10-14T10:00:02Z&limit=300"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?after=2026-10-14T10:00:02Z&limit=300"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?limit=300"
  - "euw1 GET /regions/aws.euw1"
scrape: [log-line, interrupt-notice]
