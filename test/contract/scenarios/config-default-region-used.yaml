description: "default_region of the configuration file selects the region of the requests"
args: [app, list]
config-file: |
  graphql_endpoint = ${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql
  default_region   = aws.use1

  [credentials]
  api_key    = abc123
  api_secret = s3cret-for-tests
expect-reads:
  - "euw1 GET /regions/aws.use1"
