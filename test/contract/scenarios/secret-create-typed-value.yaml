description: "a secret value typed on a terminal ends at Ctrl-D"
args: [secret, create, --name, TYPED_SECRET]
tty: true
steps:
  - {expect-any: ["Reading from STDIN - hit (Control + D) to stop.", "Enter value for secret"]}
  - {send: "typed-secret-value\r"}
  - {send: "\x04"}
  - {expect: "Secret"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
