description: --api-key is offered as the default of the key prompt instead of the stored key
args: [configure, --api-key, abc123]
tty: true
requires-hotfix: true
config-file: |
  graphql_endpoint = ${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql
  default_region   = aws.euw1

  [credentials]
  api_key    = stale-key
  api_secret = s3cret-for-tests
steps:
  - {expect: "Enter your Vonage api key:"}
  - {send: "\r"}
  - {expect: "Enter your Vonage api secret"}
  - {send: "\r"}
  - {expect: "Select your Vonage region:"}
  - {send: "\r"}
  - {expect: "New configuration file written to"}
expect-reads: [euw1 GET /regions]
