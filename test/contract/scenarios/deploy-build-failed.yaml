description: "a build that reports failure stops the deploy"
args: [deploy]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
fixtures:
  buildStatus: [{status: failed}]
  build:
    connections:
      - [{send: "Starting build"}, {send: "Step 1/2 : install dependencies"}, {send: "\u001b[35mℹ\u001b[0m Status - failed"}]
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
  - "euw1 GET /packages/<uuid>/build/status"
