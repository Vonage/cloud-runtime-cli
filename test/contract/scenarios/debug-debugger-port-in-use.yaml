description: "a debugger port that is already in use is reported"
args: [debug, --app-port, "${PORT:app}", --debugger-port, "${PORT:debugger}"]
cwd: work/project
hold-ports: [debugger]
files:
  - path: work/project/vcr.yml
    content: |
      project: {name: my-project}
      instance: {name: dev, runtime: nodejs18, region: aws.euw1, application-id: 00000000-0000-4000-8000-000000000601}
      debug: {application-id: 00000000-0000-4000-8000-000000000602, entrypoint: [sleep, "30"]}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
