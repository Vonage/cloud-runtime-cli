description: "two typed lines are one secret value"
args: [secret, create, --name, TYPED_MULTILINE]
tty: true
steps:
  - {expect: "Reading from STDIN - hit (Control + D) to stop."}
  - {send: "first line\r"}
  - {expect: "first line"}
  - {send: "second line\r"}
  - {expect: "second line"}
  - {send: "\x04"}
  - {expect: "Secret"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
