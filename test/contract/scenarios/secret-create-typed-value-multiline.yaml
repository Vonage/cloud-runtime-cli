description: "two typed lines are one secret value"
args: [secret, create, --name, TYPED_MULTILINE]
tty: true
steps:
  - {expect-any: ["Reading from STDIN - hit (Control + D) to stop.", "Enter value for secret"]}
  - {send: "first line\rsecond line\r"}
  - {send: "\x04"}
  - {expect: "Secret"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
