description: "a new value for a secret typed on a terminal ends at Ctrl-D"
args: [secret, update, --name, DB_URL]
tty: true
steps:
  - {expect: "Reading from STDIN - hit (Control + D) to stop."}
  - {send: "new-typed-value\r"}
  - {expect: "new-typed-value"}
  - {send: "\x04"}
  - {expect: "Secret"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
