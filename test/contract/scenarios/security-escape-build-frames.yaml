description: "build output with terminal control sequences is printed without them"
group: deploy
args: [deploy]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
fixtures:
  build:
    connections:
      - [{send: "Starting \x1b]0;pwned\x07build"}, {send: "\x1b[2Jcleared screen frame"}, {send: "progress 10%\rprogress 100%"}, {send: "\x1b[31mred output\x1b[0m"}, {send: "\x1b[35mℹ\x1b[0m Status - completed"}]
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
  - "euw1 GET /packages/<uuid>/build/status"
scrape: [deployed-banner, deployed-instance-id, deployed-service-name, deployed-host-address]
