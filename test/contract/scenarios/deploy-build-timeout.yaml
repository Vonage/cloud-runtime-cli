description: "--timeout ends a deploy whose build outlasts it"
args: [deploy, -t, 2s]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
fixtures:
  build:
    connections:
      - [{send: "Starting build"}, {sleep: 800ms}, {send: "Step 1/3 : install dependencies"}, {sleep: 2s}, {send: "Step 2/3 : compile"}, {hang: true}]
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
