description: "credential flags win over the credentials of the configuration file"
args: [--api-key, abc123, --api-secret, s3cret-for-tests, app, list]
config-file: |
  graphql_endpoint = ${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql
  default_region   = aws.euw1

  [credentials]
  api_key    = abc123
  api_secret = a-wrong-secret
expect-reads:
  - "euw1 GET /regions/aws.euw1"
