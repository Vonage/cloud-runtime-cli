description: "a failed poll prints a warning and following goes on"
args: [instance, log, --id, 00000000-0000-4000-8000-000000000501, --follow]
fixtures:
  logs:
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "first", timestamp: "2026-10-14T10:00:01Z"}
    - {instance: 00000000-0000-4000-8000-000000000501, level: info, source: application, message: "second", timestamp: "2026-10-14T10:00:02Z", visibleAfterPolls: 1}
  overrides:
    - {match: "POST graphql:Logs", skip: 1, times: 1, status: 500, body: '{"error":{"code":1001,"message":"internal error","traceId":"trace-500"}}'}
    - {match: "GET /instances/*/logs", skip: 1, times: 1, status: 500, body: '{"error":{"code":1001,"message":"internal error","traceId":"trace-500"}}'}
steps:
  - {wait-stderr: Error fetching logs}
  - {wait-stdout: second}
  - {signal: SIGINT}
expect-reads:
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?after=2026-10-14T10:00:01Z&limit=300"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?after=2026-10-14T10:00:01Z&limit=300"
  - "euw1 GET /instances/00000000-0000-4000-8000-000000000501/logs?limit=300"
  - "euw1 GET /regions/aws.euw1"
scrape: [log-line, interrupt-notice]
