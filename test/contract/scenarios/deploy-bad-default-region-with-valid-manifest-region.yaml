description: "an unknown default region is reported even when the manifest names a valid region"
args: [deploy]
cwd: work/project
config-file: |
  graphql_endpoint = ${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql
  default_region   = aws.nope

  [credentials]
  api_key    = abc123
  api_secret = s3cret-for-tests
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
  - "euw1 GET /packages/<uuid>/build/status"
scrape-except: [deployed-banner, deployed-instance-id, deployed-service-name, deployed-host-address]
