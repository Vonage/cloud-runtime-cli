description: "--verbose does not print the values of authorization and cookie headers of a relayed request"
group: debug
args: [debug, --app-port, "${PORT:app}", --debugger-port, "${PORT:debugger}", --verbose]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project: {name: my-project}
      instance: {name: dev, runtime: nodejs18, region: aws.euw1, application-id: 00000000-0000-4000-8000-000000000601}
      debug: {application-id: 00000000-0000-4000-8000-000000000602, entrypoint: ["${TESTAPP}"]}
steps:
  - {wait-peer: connected}
  - {wait-stdout: testapp env XDG_CONFIG_HOME}
  - {peer-send: {id: r1, operation: execute, method: GET, route: /hello, headers: {Accept: [text/plain], Authorization: ["Bearer token-value-for-tests"], Cookie: ["session=cookie-value-for-tests"]}, payload: ""}}
  - {wait-peer-response: r1}
  - {signal: SIGINT}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
scrape: [debug-access-log]
