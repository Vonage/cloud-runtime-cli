description: "a link to a file outside the project is uploaded as a link and its target is not read"
group: deploy
args: [deploy]
cwd: work/project
files:
  - path: work/project/vcr.yml
    content: |
      project:
        name: my-project
      instance:
        name: dev
        runtime: nodejs18
        region: aws.euw1
        application-id: 00000000-0000-4000-8000-000000000601
        entrypoint: [node, index.js]
  - path: work/project/index.js
    content: |
      console.log('hello');
  - path: work/project/package.json
    content: |
      {"name": "my-project", "version": "1.0.0"}
  - {path: work/project/src/app.js, content: "module.exports = {};\n"}
  - {path: work/project/outside-link, link: "${OUTSIDE}/private.txt"}
  - {path: outside/private.txt, content: "private data outside the project\n"}
expect-reads:
  - "euw1 GET /regions/aws.euw1"
  - "euw1 GET /projects/my-project"
  - "euw1 GET /packages/<uuid>/build/status"
scrape: [deployed-banner, deployed-instance-id, deployed-service-name, deployed-host-address]
