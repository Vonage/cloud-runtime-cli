description: "comments and spaces around = are accepted in the configuration file"
args: [app, list]
config-file: |
  ; a comment
  # another comment
  graphql_endpoint    =    ${FAKE}/v1/vcr/euw1/api/graphql/v1/graphql
     default_region=aws.euw1

  [credentials]
  # credentials
  api_key =abc123
  api_secret=   s3cret-for-tests
expect-reads:
  - "euw1 GET /regions/aws.euw1"
