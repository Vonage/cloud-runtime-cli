description: "secret names with terminal control sequences are printed without them"
group: secret
args: [secret, list]
fixtures:
  secrets: ["EVIL\x1b]0;pwned\x07NAME", "CLEAR\x1b[2JNAME", "MOVE\x1b[10A\x1b[5CNAME", "PLAIN_NAME"]
expect-reads:
  - "euw1 GET /regions/aws.euw1"
scrape: [secret-name]
scrape-except: [secret-name]
